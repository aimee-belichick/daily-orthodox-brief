name: Daily fetch

on:
  schedule:
    # 11:00 UTC ≈ 6:00am Central (Daylight) / 5:00am Central (Standard).
    # GitHub cron does not observe DST and runs can be delayed under load,
    # so this lands "early morning Central" rather than at an exact time.
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python fetch.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update daily data"
          git push
