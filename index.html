<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Orthodox Brief</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060606">
<style>
  :root {
    --bg: #060606;
    --cross: #161616;
    --ink: #f7f4ec;
    --ink-soft: #cbc6b8;
    --ink-faint: #8f897a;
    --rule: #302f2c;
    --accent: #d99a6c;
    --card-bg: #1c1c1a;
    --warn-bg: #2c2314;
    --warn-ink: #e0b878;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height: 100vh;
  }
  #bg-cross {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(65vw, 420px);
    height: 88vh;
    z-index: 0;
    pointer-events: none;
  }
  #bg-cross .cross-shape { fill: var(--cross); }
  a { color: var(--accent); }
  main {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
    padding: 1.75rem 1.25rem 4rem;
  }

  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  .nav-btn {
    appearance: none;
    border: none;
    background: none;
    color: var(--ink);
    font-size: 1.5rem;
    line-height: 1;
    padding: 0.5rem 0.75rem;
    cursor: pointer;
    border-radius: 8px;
  }
  .nav-btn:disabled { color: var(--rule); cursor: default; }
  .nav-btn:not(:disabled):active { background: var(--rule); }

  .date-heading { text-align: center; flex: 1; }
  .date-heading .weekday {
    display: block;
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 0.15rem;
  }
  .date-heading .date {
    display: block;
    font-family: var(--serif);
    font-size: 1.4rem;
  }
  .today-btn {
    display: block;
    margin: -0.75rem auto 1.5rem;
    text-align: center;
    background: none;
    border: none;
    color: var(--accent);
    font-size: 0.85rem;
    cursor: pointer;
  }

  section.card {
    background: var(--card-bg);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 1.1rem 1.25rem;
    margin-bottom: 1rem;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  section.card h2 {
    margin: 0 0 0.6rem;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
  }

  .feast-title {
    font-family: var(--serif);
    font-size: 1.3rem;
    margin: 0;
  }

  .great-feast-badge {
    margin: 0 0 0.5rem;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .summary-title {
    font-family: var(--serif);
    font-size: 1.05rem;
    color: var(--ink-soft);
    margin: 0 0 0.75rem;
  }

  .saints-list { margin: 0; padding: 0; list-style: none; }
  .saints-list li { margin-bottom: 0.35rem; font-size: 0.98rem; }

  .story-block { margin-bottom: 1.1rem; }
  .story-block:last-child { margin-bottom: 0; }
  .story-title { font-weight: 600; font-size: 0.95rem; margin: 0 0 0.3rem; }
  .story-text { font-family: var(--serif); font-size: 1.05rem; line-height: 1.6; color: var(--ink-soft); }
  .story-text p { margin: 0 0 0.6rem; }
  .story-text p:last-child { margin-bottom: 0; }

  .fast-desc { font-size: 1.05rem; margin: 0 0 0.35rem; }
  .fast-abstentions { font-size: 0.9rem; color: var(--ink-soft); margin: 0 0 0.6rem; }
  .fast-cal-link { font-size: 0.85rem; }

  .reading-block { margin-bottom: 1.4rem; }
  .reading-block:last-child { margin-bottom: 0; }
  .reading-label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 0 0 0.4rem;
  }
  .reading-text {
    font-family: var(--serif);
    font-size: 1.15rem;
    line-height: 1.6;
    margin: 0;
    max-width: 34em;
  }

  .link-row {
    display: flex;
    gap: 1.25rem;
    flex-wrap: wrap;
    font-size: 0.95rem;
  }

  .service-select {
    width: 100%;
    background: var(--bg);
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 0.6rem 0.7rem;
    font-size: 1rem;
    font-family: var(--sans);
  }
  .service-text-scroll { margin-top: 0.5rem; }
  .service-text-panel { max-height: calc(50vh + 96px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .service-text-body {
    font-family: var(--serif);
    font-size: 1.05rem;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .checkable-line {
    display: flex;
    align-items: flex-start;
    gap: 0.65rem;
    margin-bottom: 0.85rem;
    cursor: pointer;
  }
  .line-check {
    flex-shrink: 0;
    width: 1.15rem;
    height: 1.15rem;
    margin-top: 0.25rem;
    accent-color: var(--accent);
  }
  .line-text {
    font-family: var(--serif);
    font-size: 1.05rem;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .checkable-line:has(.line-check:checked) .line-text { opacity: 0.4; }

  .event-list { margin: 0; padding: 0; list-style: none; }
  .event-item { padding: 0.5rem 0; border-bottom: 1px solid var(--rule); }
  .event-item:last-child { border-bottom: none; }
  .event-item a { text-decoration: none; color: inherit; }
  .event-time { display: block; font-size: 0.8rem; color: var(--ink-faint); }
  .event-title { display: block; font-size: 1rem; }

  .prayer-group { margin-bottom: 0.75rem; }
  .prayer-group:last-child { margin-bottom: 0; }
  .prayer-group h3 {
    margin: 0 0 0.2rem;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .prayer-names { margin: 0; font-size: 0.98rem; }

  .banner {
    background: var(--warn-bg);
    color: var(--warn-ink);
    border-radius: 10px;
    padding: 0.7rem 0.9rem;
    font-size: 0.85rem;
    margin-bottom: 1rem;
  }

  footer {
    text-align: center;
    color: var(--ink-faint);
    font-size: 0.75rem;
    margin-top: 2rem;
    line-height: 1.6;
  }

  .empty-state {
    text-align: center;
    color: var(--ink-faint);
    padding: 3rem 1rem;
    font-family: var(--serif);
    font-size: 1.1rem;
  }
</style>
</head>
<body>
<svg id="bg-cross" viewBox="0 0 200 400" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
  <g class="cross-shape">
    <rect x="88" y="30" width="24" height="340"/>
    <rect x="55" y="72" width="90" height="24"/>
    <rect x="30" y="164" width="140" height="28"/>
    <rect x="48" y="268" width="104" height="24"/>
  </g>
</svg>
<main id="app">
  <div class="empty-state" id="loading">Loading today&rsquo;s brief&hellip;</div>
</main>

<script>
(function () {
  "use strict";

  var app = document.getElementById("app");
  var dayCache = {};
  var index = null;
  var currentDate = null;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function parseISODate(s) {
    var parts = s.split("-").map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }

  function formatISODate(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function addDays(dateStr, n) {
    var d = parseISODate(dateStr);
    d.setDate(d.getDate() + n);
    return formatISODate(d);
  }

  function friendlyDate(dateStr) {
    var d = parseISODate(dateStr);
    var weekday = d.toLocaleDateString(undefined, { weekday: "long" });
    var rest = d.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });
    return { weekday: weekday, date: rest };
  }

  function formatEventTime(sqlDateTime) {
    if (!sqlDateTime) return "";
    var iso = sqlDateTime.replace(" ", "T");
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    var isMidnight = d.getHours() === 0 && d.getMinutes() === 0;
    if (isMidnight) return "All day";
    return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  function fetchJSON(url) {
    return fetch(url, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status + " for " + url);
      return r.json();
    });
  }

  function loadIndex() {
    return fetchJSON("data/index.json").then(function (data) {
      index = data;
    });
  }

  function loadDay(dateStr) {
    if (dayCache[dateStr]) return Promise.resolve(dayCache[dateStr]);
    return fetchJSON("data/days/" + dateStr + ".json").then(function (data) {
      dayCache[dateStr] = data;
      return data;
    });
  }

  function relativeStaleness(iso) {
    if (!iso) return "never";
    var then = new Date(iso).getTime();
    if (isNaN(then)) return "unknown";
    var diffH = Math.round((Date.now() - then) / 36e5);
    if (diffH < 1) return "just now";
    if (diffH < 24) return diffH + "h ago";
    var diffD = Math.round(diffH / 24);
    return diffD + "d ago";
  }

  function renderFeastSection(lit) {
    if (!lit || !lit.feasts || !lit.feasts.length) return "";
    var badge = "";
    var heading = "Recognizing";
    if (lit.great_feast) {
      heading = "Feast";
      var label = lit.great_feast.is_pascha ? "Pascha" : "Great Feast";
      badge = '<p class="great-feast-badge">&#10022; ' + esc(label) + "</p>";
    }
    return (
      "<section class=\"card\"><h2>" + esc(heading) + "</h2>" +
      badge +
      '<p class="feast-title">' +
      lit.feasts.map(esc).join(" &middot; ") +
      "</p></section>"
    );
  }

  function renderSaintsSection(lit) {
    if (!lit || !lit.saints || !lit.saints.length) return "";
    var items = lit.saints.map(function (name) { return "<li>" + esc(name) + "</li>"; }).join("");
    var summary = lit.summary_title ? '<p class="summary-title">' + esc(lit.summary_title) + "</p>" : "";
    var synaxarion = lit.synaxarion
      ? renderTextChooser("synaxarion", [{ label: "Synaxarion", text: lit.synaxarion }])
      : "";
    return (
      '<section class="card"><h2>Saints Commemorated</h2>' +
      summary +
      '<ul class="saints-list">' +
      items +
      "</ul>" +
      synaxarion +
      "</section>"
    );
  }

  function renderStoriesSection(lit) {
    if (!lit || !lit.stories || !lit.stories.length) return "";
    var blocks = lit.stories
      .map(function (s) {
        return (
          '<div class="story-block"><p class="story-title">' +
          esc(s.title) +
          '</p><div class="story-text">' +
          s.html +
          "</div></div>"
        );
      })
      .join("");
    return '<section class="card"><h2>About Today&rsquo;s Saints</h2>' + blocks + "</section>";
  }

  function renderFastingSection(lit) {
    if (!lit || !lit.fasting) return "";
    var f = lit.fasting;
    var abst = f.abstentions && f.abstentions.length
      ? '<p class="fast-abstentions">Abstain from: ' + f.abstentions.map(esc).join(", ") + "</p>"
      : "";
    var calLink = index.links.fasting_calendar_pdf
      ? '<p class="fast-cal-link"><a href="' + esc(index.links.fasting_calendar_pdf) + '" target="_blank" rel="noopener">Full-year fasting calendar &rarr;</a></p>'
      : "";
    return (
      '<section class="card"><h2>Fasting</h2><p class="fast-desc">' +
      esc(f.description) +
      "</p>" +
      abst +
      calLink +
      "</section>"
    );
  }

  function renderReadingSection(lit) {
    if (!lit || !lit.readings || !lit.readings.length) return "";
    var blocks = lit.readings
      .map(function (r) {
        return (
          '<div class="reading-block"><p class="reading-label">' +
          esc(r.display) +
          '</p><p class="reading-text">' +
          esc(r.text) +
          "</p></div>"
        );
      })
      .join("");
    return '<section class="card"><h2>Reading</h2>' + blocks + "</section>";
  }

  function renderTextChooser(groupId, items) {
    if (!items || !items.length) return "";
    var options = '<option value="">Choose a text to view&hellip;</option>' +
      items
        .map(function (it, i) { return '<option value="' + i + '">' + esc(it.label) + "</option>"; })
        .join("");
    var panels = items
      .map(function (it, i) {
        var body = it.html
          ? it.html
          : it.text
          ? '<div class="service-text-body">' + esc(it.text) + "</div>"
          : '<div class="service-text-body">' +
            '<p>Text isn&rsquo;t available inline for this one.</p>' +
            (it.pdf_url ? '<a href="' + esc(it.pdf_url) + '" target="_blank" rel="noopener">Open PDF &rarr;</a>' : "") +
            "</div>";
        return '<div class="service-text-panel" data-group="' + esc(groupId) + '" data-index="' + i + '" hidden>' + body + "</div>";
      })
      .join("");
    return (
      '<select class="service-select text-select" data-group="' + esc(groupId) + '">' + options + "</select>" +
      '<div class="service-text-scroll">' + panels + "</div>"
    );
  }

  function renderCheckableBody(text, storageKey) {
    var paragraphs = text.split(/\n{2,}/).map(function (p) { return p.trim(); }).filter(Boolean);
    var rows = paragraphs
      .map(function (p, i) {
        return (
          '<label class="checkable-line">' +
          '<input type="checkbox" class="line-check" data-index="' + i + '">' +
          '<span class="line-text">' + esc(p) + "</span>" +
          "</label>"
        );
      })
      .join("");
    return '<div class="checkable-body" data-storage-key="' + esc(storageKey) + '">' + rows + "</div>";
  }

  function renderServiceLinksSection(lit, dateStr) {
    if (!lit || !lit.service_texts || !lit.service_texts.length) return "";
    var items = lit.service_texts.map(function (s) {
      if (!s.text) return s;
      var storageKey = "serviceProgress:" + dateStr + ":" + s.label;
      return { label: s.label, html: renderCheckableBody(s.text, storageKey) };
    });
    return '<section class="card"><h2>Service Texts</h2>' + renderTextChooser("service", items) + "</section>";
  }

  function renderEventsSection(day) {
    if (!day.events || !day.events.length) return "";
    var items = day.events
      .map(function (ev) {
        var time = formatEventTime(ev.start);
        var body = '<span class="event-time">' + esc(time) + '</span><span class="event-title">' + esc(ev.title) + "</span>";
        return (
          '<li class="event-item">' +
          (ev.url ? '<a href="' + esc(ev.url) + '" target="_blank" rel="noopener">' + body + "</a>" : body) +
          "</li>"
        );
      })
      .join("");
    return (
      '<section class="card"><h2>Parish Events Today</h2><ul class="event-list">' +
      items +
      '</ul><p class="fast-cal-link" style="margin-top:0.6rem"><a href="' +
      esc(index.links.parish_calendar) +
      '" target="_blank" rel="noopener">Parish calendar &rarr;</a></p></section>'
    );
  }

  function renderPrayerListSection() {
    var pl = index.prayer_list;
    if (!pl) return "";
    var groups = [
      { key: "sick", label: "For the health of body and soul" },
      { key: "military", label: "Serving in our armed forces" },
      { key: "catechumens", label: "Our catechumens" },
    ];
    var body = groups
      .map(function (g) {
        var names = pl[g.key];
        if (!names || !names.length) return "";
        return (
          '<div class="prayer-group"><h3>' +
          esc(g.label) +
          '</h3><p class="prayer-names">' +
          names.map(esc).join(", ") +
          "</p></div>"
        );
      })
      .join("");
    if (!body) return "";
    return '<section class="card"><h2>Prayer List</h2>' + body + "</section>";
  }

  function renderStalenessBanners() {
    var s = index.status || {};
    var messages = [];
    if (!s.liturgical_ok) messages.push("Couldn&rsquo;t reach the liturgical calendar this morning &mdash; showing the most recent data available.");
    if (!s.parish_events_ok) messages.push("Couldn&rsquo;t reach the parish calendar this morning &mdash; events shown may be out of date.");
    if (!s.bulletin_ok) messages.push("Couldn&rsquo;t find a new bulletin &mdash; linking to the last known one.");
    if (!s.prayer_list_ok) messages.push("Couldn&rsquo;t read the prayer list from the bulletin &mdash; showing the last known list.");
    if (!messages.length) return "";
    return messages.map(function (m) { return '<div class="banner">' + m + "</div>"; }).join("");
  }

  function renderFooter() {
    var ls = index.last_successful || {};
    return (
      "<footer>Liturgical data updated " +
      esc(relativeStaleness(ls.liturgical)) +
      " &middot; Parish calendar updated " +
      esc(relativeStaleness(ls.parish_events)) +
      "<br>Brief generated " +
      esc(relativeStaleness(index.generated_at)) +
      "</footer>"
    );
  }

  function canGoBack(dateStr) {
    return dateStr > index.available_dates[0];
  }
  function canGoForward(dateStr) {
    return dateStr < index.available_dates[index.available_dates.length - 1];
  }

  function renderNavBar(dateStr) {
    var fd = friendlyDate(dateStr);
    return (
      '<div class="nav-bar">' +
      '<button class="nav-btn" id="prevBtn" ' + (canGoBack(dateStr) ? "" : "disabled") + ' aria-label="Previous day">&larr;</button>' +
      '<div class="date-heading"><span class="weekday">' + esc(fd.weekday) + '</span><span class="date">' + esc(fd.date) + "</span></div>" +
      '<button class="nav-btn" id="nextBtn" ' + (canGoForward(dateStr) ? "" : "disabled") + ' aria-label="Next day">&rarr;</button>' +
      "</div>"
    );
  }

  function wireNavBar(dateStr) {
    var prevBtn = document.getElementById("prevBtn");
    var nextBtn = document.getElementById("nextBtn");
    var todayBtn = document.getElementById("todayBtn");
    if (prevBtn) prevBtn.addEventListener("click", function () { goTo(addDays(dateStr, -1)); });
    if (nextBtn) nextBtn.addEventListener("click", function () { goTo(addDays(dateStr, 1)); });
    if (todayBtn) todayBtn.addEventListener("click", function () { goTo(index.today); });
  }

  function wireTextChoosers() {
    document.querySelectorAll(".text-select").forEach(function (select) {
      var group = select.getAttribute("data-group");
      select.addEventListener("change", function () {
        document.querySelectorAll('.service-text-panel[data-group="' + group + '"]').forEach(function (p) { p.hidden = true; });
        if (select.value !== "") {
          var target = document.querySelector('.service-text-panel[data-group="' + group + '"][data-index="' + select.value + '"]');
          if (target) target.hidden = false;
        }
      });
    });
  }

  function applyProgress(container, n) {
    container.querySelectorAll(".line-check").forEach(function (cb) {
      cb.checked = parseInt(cb.getAttribute("data-index"), 10) < n;
    });
  }

  function wireCheckableBodies() {
    document.querySelectorAll(".checkable-body").forEach(function (container) {
      var key = container.getAttribute("data-storage-key");
      var saved = parseInt(localStorage.getItem(key) || "0", 10);
      applyProgress(container, saved);
      container.addEventListener("change", function (e) {
        if (!e.target.classList.contains("line-check")) return;
        var idx = parseInt(e.target.getAttribute("data-index"), 10);
        var n = e.target.checked ? idx + 1 : idx;
        applyProgress(container, n);
        localStorage.setItem(key, String(n));
      });
    });
  }

  function render(dateStr, day) {
    var lit = day.liturgical && day.liturgical.status === "ok" ? day.liturgical : null;

    var html = "";
    html += renderNavBar(dateStr);

    if (dateStr !== index.today) {
      html += '<button class="today-btn" id="todayBtn">Back to today</button>';
    }

    html += renderStalenessBanners();
    html += renderFeastSection(lit);
    html += renderFastingSection(lit);
    html += renderSaintsSection(lit);
    html += renderStoriesSection(lit);
    html += renderServiceLinksSection(lit, dateStr);
    html += renderEventsSection(day);
    html += renderPrayerListSection();
    html += renderReadingSection(lit);
    html += renderFooter();

    if (!lit) {
      html =
        renderNavBar(dateStr) +
        '<div class="banner">Couldn&rsquo;t reach the liturgical calendar for this day.</div>' +
        renderEventsSection(day) +
        renderPrayerListSection() +
        renderFooter();
    }

    app.innerHTML = html;
    currentDate = dateStr;
    wireNavBar(dateStr);
    wireTextChoosers();
    wireCheckableBodies();
  }

  function goTo(dateStr) {
    if (dateStr < index.available_dates[0] || dateStr > index.available_dates[index.available_dates.length - 1]) return;
    app.innerHTML = '<div class="empty-state">Loading&hellip;</div>';
    loadDay(dateStr)
      .then(function (day) { render(dateStr, day); })
      .catch(function () {
        app.innerHTML = renderNavBar(dateStr) + '<div class="banner">Couldn&rsquo;t load this day. Pull to refresh or try again later.</div>';
        currentDate = dateStr;
        wireNavBar(dateStr);
      });
  }

  loadIndex()
    .then(function () { return loadDay(index.today); })
    .then(function (day) { render(index.today, day); })
    .catch(function (err) {
      app.innerHTML = '<div class="empty-state">Couldn&rsquo;t load the brief.<br><span style="font-size:0.8rem">' + esc(err.message) + "</span></div>";
    });
})();
</script>
</body>
</html>
